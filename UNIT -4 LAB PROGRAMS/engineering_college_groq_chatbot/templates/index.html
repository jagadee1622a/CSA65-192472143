<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering College AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="page">
        <div class="chat-card">

            <div class="header">
                <div class="logo">🎓</div>
                <div>
                    <h1>Engineering College AI Chatbot</h1>
                    <p>Powered by Groq AI</p>
                </div>
                <button class="clear-btn" onclick="clearChat()">Clear</button>
            </div>

            <div id="chatbox" class="chatbox">
                <div class="message bot">
                    <div class="avatar">🤖</div>
                    <div class="bubble">
                        Hello! 👋 I'm your Engineering College AI Chatbot.
                        <br><br>
                        Ask me about <b>fees, CSE, exams, departments,
                        attendance, placements, hostel, library</b> and more.
                    </div>
                </div>
            </div>

            <div class="suggestions">
                <button onclick="askSuggestion('What is CSE?')">What is CSE?</button>
                <button onclick="askSuggestion('How much is the college fee?')">College Fee</button>
                <button onclick="askSuggestion('When do exams start?')">Exam Details</button>
                <button onclick="askSuggestion('Tell me about placements')">Placements</button>
            </div>

            <div class="input-area">
                <input
                    id="message"
                    type="text"
                    placeholder="Type your question..."
                    autocomplete="off"
                >
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>

            <div class="footer">
                AI responses may need to be verified with official college sources.
            </div>

        </div>
    </div>

<script>
let history = [];

const input = document.getElementById("message");
const chatbox = document.getElementById("chatbox");
const sendBtn = document.getElementById("sendBtn");

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

function addMessage(text, type) {
    const row = document.createElement("div");
    row.className = "message " + type;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = type === "user" ? "👤" : "🤖";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatbox.appendChild(row);

    chatbox.scrollTop = chatbox.scrollHeight;

    return bubble;
}

function askSuggestion(question) {
    input.value = question;
    sendMessage();
}

async function sendMessage() {
    const message = input.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    history.push({
        role: "user",
        content: message
    });

    input.value = "";
    sendBtn.disabled = true;

    const loadingBubble = addMessage("Thinking...", "bot");

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                history: history
            })
        });

        const data = await response.json();

        loadingBubble.textContent = data.reply;

        history.push({
            role: "assistant",
            content: data.reply
        });

    } catch (error) {
        loadingBubble.textContent =
            "Sorry, I could not connect to the server.";
    }

    sendBtn.disabled = false;
    input.focus();
}

function clearChat() {
    history = [];

    chatbox.innerHTML = `
        <div class="message bot">
            <div class="avatar">🤖</div>
            <div class="bubble">
                Chat cleared! 👋 What would you like to know?
            </div>
        </div>
    `;
}
</script>

</body>
</html>
